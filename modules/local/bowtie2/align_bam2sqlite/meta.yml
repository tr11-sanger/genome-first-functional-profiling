name: "bowtie2_align_bam2sqlite"
description: Align reads with Bowtie2 and pipe SAM output directly into bam2sqlite for alignment database creation
keywords:
  - align
  - map
  - metagenomics
  - sqlite
  - bowtie2
tools:
  - bowtie2:
      description: |
        Bowtie 2 is an ultrafast and memory-efficient tool for aligning
        sequencing reads to long reference sequences.
      homepage: http://bowtie-bio.sourceforge.net/bowtie2/index.shtml
      documentation: http://bowtie-bio.sourceforge.net/bowtie2/manual.shtml
      doi: 10.1038/nmeth.1923
      licence: ["GPL-3.0-or-later"]
      identifier: ""
  - bam2sqlite:
      description: "Custom script to parse SAM alignments, compute ANI, and build a gzipped SQLite database of read-to-genome mappings"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: |
          List of input FastQ files of size 1 and 2 for single-end and paired-end data,
          respectively.
  - - meta2:
        type: map
        description: Groovy Map containing reference information
    - index:
        type: file
        description: Bowtie2 genome index files
        pattern: "*.bt2"
  - - meta3:
        type: map
        description: Groovy Map containing reference information
    - fasta:
        type: file
        description: Reference genome FASTA file
        pattern: "*.{fna,fa,fasta}"
  - - meta4:
        type: map
        description: Groovy Map containing reference information
    - genome_contigs:
        type: file
        description: CSV mapping genome accession to contig IDs
        pattern: "*.csv"
  - - meta5:
        type: map
        description: Groovy Map containing reference information
    - genome_species:
        type: file
        description: TSV mapping genome accession to species
        pattern: "*.tsv"

output:
  sqlite:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.sqlite.gz":
          type: file
          description: Gzipped SQLite database of read alignment mappings
          pattern: "*.sqlite.gz"
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.log":
          type: file
          description: Bowtie2 alignment log
          pattern: "*.log"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@joseespinosa"
  - "@drpatelh"
  - "@timrozday-mgnify"
maintainers:
  - "@timrozday-mgnify"
