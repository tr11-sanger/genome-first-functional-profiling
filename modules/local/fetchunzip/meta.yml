---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "fetchunzip"
description: Validate checksums and extract downloaded archives into a named directory
keywords:
  - download
  - extract
  - database
  - checksum
tools:
  - "fetchunzip":
      description: "Custom module to verify MD5 checksums and decompress tar.gz, gz, or plain files into a staging directory"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing database information
          e.g. [ id:'genome_catalogue' ]
    - dir_name:
        type: string
        description: Name of the output directory for extracted files
    - fp:
        type: file
        description: Downloaded archive file (tar.gz, gz, or plain)
    - checksum_path:
        type: file
        description: Optional file containing the expected MD5 checksum
    - checksum:
        type: string
        description: Optional inline MD5 checksum string

output:
  database:
    - - meta:
          type: map
          description: Groovy Map containing database information
      - "${dir_name}":
          type: directory
          description: Extracted database directory

authors:
  - "@timrozday-mgnify"
maintainers:
  - "@timrozday-mgnify"
