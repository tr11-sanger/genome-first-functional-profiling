---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "sqlite2profile_top"
description: Generate species, genome, and CDS coverage profiles from a SQLite alignment database using winner-takes-all assignment
keywords:
  - profiling
  - metagenomics
  - coverage
  - sqlite
tools:
  - "sqlite2profile_top2":
      description: "Custom script for top (winner-takes-all) read assignment with iterative coverage-ratio filtering"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - sqlite:
        type: file
        description: Gzipped SQLite database of read alignment mappings
        pattern: "*.sqlite.gz"
    - genome2cds:
        type: file
        description: File listing paths to genome-to-CDS mapping TSV files
        pattern: "*.txt"

output:
  species_profile:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*species_coverage.tsv.gz":
          type: file
          description: Per-species coverage depth and breadth TSV
          pattern: "*species_coverage.tsv.gz"
  genome_profile:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*genome_coverage.tsv.gz":
          type: file
          description: Per-genome coverage TSV
          pattern: "*genome_coverage.tsv.gz"
  species_cds_profile:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*species_cds_coverage.tsv.gz":
          type: file
          description: CDS-level coverage TSV per species
          pattern: "*species_cds_coverage.tsv.gz"
      - "*species_index.tsv.gz":
          type: file
          description: Species index for CDS coverage profiles
          pattern: "*species_index.tsv.gz"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@timrozday-mgnify"
maintainers:
  - "@timrozday-mgnify"
